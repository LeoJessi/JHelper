apply plugin: 'com.android.application'
apply plugin: "kotlin-android"

android {
    namespace = "top.jessi.jhelper_sample"

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "top.jessi.jhelper_sample"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    // 引入本地 ILog 项目的 ILog 源码，便于直接调试
    // 对应原 JitPack 依赖：implementation 'com.github.LeoJessi.ILog:ILog:1.236.8'
    sourceSets {
        main {
            java.srcDirs += 'D:/Android/AndroidProjects/jessi/ILog/ILog'
//            java.srcDirs += 'D:/Android/AndroidProjects/jessi/ILog/ILog/src/main/java'
        }
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation project(":JHelper")
}


